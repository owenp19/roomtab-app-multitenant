<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Notificaciones – RoomTab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">

  <script src="/js/theme-loader.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <link rel="icon" type="image/png" href="/images/roomtab-app-icon.png" sizes="any">
  <link rel="apple-touch-icon" href="/images/roomtab-app-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2E59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
  <div id="app-loader"><div class="loader-content"><img src="/images/roomtab-logo-white.png" alt="RoomTab" class="loader-logo"><div class="loader-spinner"></div><p class="loader-text">Cargando...</p></div></div>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="sidebar" id="sidebar-container"></div>

    <main class="main-panel">
      <header class="main-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir men&uacute;">
          <i class="ph-light ph-list"></i>
        </button>

        <div class="main-header-title">
          <div id="breadcrumb">
            <span class="crumb">
              <i class="ph-light ph-bell"></i>
              <span class="crumb-current">Notificaciones</span>
            </span>
          </div>

          <h1>
            <i class="ph-light ph-bell"></i>
            Notificaciones de vencimiento
          </h1>

          <p id="page-description">
            Productos pr&oacute;ximos a vencer en los minibares.
          </p>
        </div>

        <div class="header-controls">
          <div class="theme-toggle-group" id="app-theme-switcher">
            <button class="theme-toggle-btn active" data-theme-mode="light" aria-label="Modo claro" title="Modo claro">
              <i class="ph-light ph-sun"></i>
            </button>
            <button class="theme-toggle-btn" data-theme-mode="dark" aria-label="Modo oscuro" title="Modo oscuro">
              <i class="ph-light ph-moon"></i>
            </button>
          </div>

          <div class="header-lang-group" id="app-lang-selector">
            <button class="header-lang-btn active" data-lang="es" aria-label="Espa&ntilde;ol" title="Espa&ntilde;ol">ES</button>
            <button class="header-lang-btn" data-lang="en" aria-label="English" title="English">EN</button>
          </div>
        </div>
      </header>

      <div class="main-content">
        <!-- Filters -->
        <div class="notif-filters">
          <div class="notif-filter-row">
            <div class="admin-form-group" style="flex:1;min-width:150px;">
              <label>Filtrar por piso</label>
              <select class="admin-input" id="filter-floor">
                <option value="">Todos los pisos</option>
              </select>
            </div>
            <div class="admin-form-group" style="flex:1;min-width:150px;">
              <label>Filtrar por habitaci&oacute;n</label>
              <select class="admin-input" id="filter-room">
                <option value="">Todas las habitaciones</option>
              </select>
            </div>
            <div class="admin-form-group" style="flex:1;min-width:150px;">
              <label>Filtrar por producto</label>
              <input class="admin-input" id="filter-product" type="text" placeholder="Buscar producto..." />
            </div>
            <div class="admin-form-group" style="display:flex;align-items:flex-end;">
              <button class="btn-primary btn-sm" id="btn-mark-all-read" title="Marcar todo como le&iacute;do">
                <i class="ph-light ph-check-double"></i> Marcar todo le&iacute;do
              </button>
            </div>
          </div>
        </div>

        <!-- Notifications list -->
        <div id="notifications-container">
          <div class="empty-state" id="notif-empty">
            <i class="ph-light ph-bell"></i>
            <h3>Cargando...</h3>
            <p>Obteniendo notificaciones.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/loader.js"></script>

  <script src="/js/app.js" defer></script>
  <script src="/js/notificaciones.js" defer></script>
  <script src="/js/chatbot.js" defer></script>
  <script>
    (function() {
      var theme = localStorage.getItem("roomtab-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("roomtab-lang") || "es";
      document.documentElement.setAttribute("lang", lang);

      document.querySelectorAll(".sidebar-nav a.nav-item[href]").forEach(function(link) {
        link.addEventListener("click", function(e) {
          var href = link.getAttribute("href");
          if (!href || href === "#" || href.startsWith("http") || href.startsWith("//") || href.startsWith("/api")) return;
          e.preventDefault();
          Loader.show();
          setTimeout(function() {
            window.location.href = href;
          }, 400);
        });
      });
    })();
  </script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
