<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Restablecer contraseña – RoomTab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">

  <script src="/js/theme-loader.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/login.css" />

  <link rel="icon" href="/images/favicon.png" sizes="any">
  <link rel="icon" type="image/png" href="/images/roomtab-app-icon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2E59">

  <style>
    .success-state { display: none; }
    .success-state.visible { display: block; }
    .forgot-form.hidden { display: none; }
  </style>
</head>
<body>
  <div class="login-page">
    <section class="login-panel">
      <div class="login-top-bar">
        <div class="theme-toggle-group" id="login-theme-switcher">
          <button class="theme-toggle-btn active" data-theme-mode="light" aria-label="Modo claro" title="Modo claro">
            <i class="ph-light ph-sun"></i>
          </button>
          <button class="theme-toggle-btn" data-theme-mode="dark" aria-label="Modo oscuro" title="Modo oscuro">
            <i class="ph-light ph-moon"></i>
          </button>
        </div>
        <div class="header-lang-group" id="login-lang-selector">
          <button class="header-lang-btn active" data-lang="es">ES</button>
          <button class="header-lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <div class="login-brand">
        <img src="/images/roomtab-logo-light.png" alt="RoomTab" class="login-brand-logo" loading="lazy" />
        <div class="login-brand-silhouette"></div>
        <div class="login-brand-text">
          <span class="login-brand-name">Minibar management system</span>
        </div>
      </div>

      <header class="login-header">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
      </header>

      <form id="forgot-form" class="login-form forgot-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="field-input-wrapper">
            <span class="field-icon"><i class="ph-light ph-envelope"></i></span>
            <input type="email" id="email" name="email" placeholder="operador@nattivo.com" autocomplete="email" required />
          </div>
        </div>

        <button type="submit" class="btn-primary" id="forgot-submit">
          Enviar enlace
        </button>

        <div id="forgot-status" class="login-status"></div>
      </form>

      <div class="success-state" id="success-state">
        <div style="text-align:center;padding:20px 0">
          <i class="ph-light ph-check-circle" style="font-size:56px;color:var(--color-success);margin-bottom:12px;display:block"></i>
          <p style="font-size:15px;color:var(--color-text);line-height:1.6;margin:0 0 8px" id="success-message">Enlace enviado. Revisa tu correo.</p>
          <p style="font-size:13px;color:var(--color-muted);margin:0" id="success-link-area"></p>
        </div>
      </div>

      <div class="login-footer">
        <span>¿Recordaste tu contraseña?</span>
        <a href="/login.html" class="link-button">Volver a iniciar sesión</a>
      </div>
    </section>

    <section class="login-photo">
      <div class="photo-overlay"></div>
      <div class="photo-decoration"><div class="photo-wave"></div></div>
      <div class="photo-caption">
        <div class="photo-caption-silhouette"></div>
        <h2>Minibar management system</h2>
        <p>Ingresa tu correo para restablecer tu contraseña.</p>
      </div>
    </section>
  </div>

  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/loader.js"></script>
  <script>
    (function () {
      var theme = localStorage.getItem("roomtab-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("roomtab-lang") || "es";
      document.documentElement.setAttribute("lang", lang);

      document.getElementById("forgot-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var status = document.getElementById("forgot-status");
        var submitBtn = document.getElementById("forgot-submit");

        status.className = "login-status";
        status.textContent = "";
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph-light ph-spinner-gap spinning"></i> Enviando...';

        fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error) throw new Error(data.error);
            document.getElementById("forgot-form").classList.add("hidden");
            var successEl = document.getElementById("success-state");
            successEl.classList.add("visible");
            document.getElementById("success-message").textContent = data.message;
            if (data._resetLink) {
              var linkArea = document.getElementById("success-link-area");
              linkArea.innerHTML = '<a href="' + data._resetLink + '" class="link-button" style="font-size:14px;font-weight:700">Haz clic aquí para restablecer ahora</a> <span style="display:block;margin-top:6px;font-size:11px;opacity:0.6">(entorno local — sin servicio de correo)</span>';
            }
          })
          .catch(function (err) {
            status.className = "login-status";
            status.textContent = err.message || "Error al enviar la solicitud.";
            submitBtn.disabled = false;
            submitBtn.textContent = "Enviar enlace";
          });
      });
    })();
  </script>
</body>
</html>
