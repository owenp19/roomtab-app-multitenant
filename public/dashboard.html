<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title data-i18n="dashboardTitle">Tablero – RoomTab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <script src="/js/theme-loader.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <link rel="icon" type="image/png" href="/images/roomtab-app-icon.png" sizes="any">
  <link rel="apple-touch-icon" href="/images/roomtab-app-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <style>
    :root {
      --dash-bg-card: var(--color-card);
      --dash-radius: var(--radius-md);
      --dash-shadow: var(--shadow-card);
      --dash-transition: var(--transition-normal);
      --color-green: #4F8F68;
      --color-yellow: #D6A84F;
      --color-red: #C75C4A;
      --color-blue: #18A7B5;
    }

    .dash-header { margin-bottom: 24px; }
    .dash-header h1 { font-family: var(--font-title); font-size: 28px; color: var(--color-heading); margin: 0 0 4px; letter-spacing: 0.02em; }
    .dash-header p { color: var(--color-muted); margin: 0; font-size: 14px; }

    .dash-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
    .dash-filter-btn { padding: 8px 18px; border-radius: var(--radius-pill); border: 1px solid var(--color-border-soft); background: var(--color-card); color: var(--color-text); font-size: 13px; cursor: pointer; transition: var(--transition-fast); font-family: var(--font-text); }
    .dash-filter-btn:hover { border-color: var(--color-primary); background: var(--color-primary-light); }
    .dash-filter-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); box-shadow: 0 2px 8px var(--color-primary-soft); }
    .dash-filter-btn i { margin-right: 6px; font-size: 15px; vertical-align: middle; }

    .dash-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .dash-kpi { background: var(--color-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs); transition: var(--transition-normal); cursor: default; position: relative; overflow: hidden; border: 1px solid var(--color-border-soft); opacity: 0; transform: translateY(20px); animation: kpiFadeIn 0.5s ease forwards; }
    .dash-kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .dash-kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--color-primary), var(--color-secondary)); opacity: 0; transition: opacity var(--transition-normal); }
    .dash-kpi:hover::before { opacity: 1; }
    .dash-kpi:nth-child(1) { animation-delay: 0.05s; }
    .dash-kpi:nth-child(2) { animation-delay: 0.10s; }
    .dash-kpi:nth-child(3) { animation-delay: 0.15s; }
    .dash-kpi:nth-child(4) { animation-delay: 0.20s; }
    .dash-kpi:nth-child(5) { animation-delay: 0.25s; }
    .dash-kpi:nth-child(6) { animation-delay: 0.30s; }
    .dash-kpi:nth-child(7) { animation-delay: 0.35s; }
    .dash-kpi:nth-child(8) { animation-delay: 0.40s; }
    .dash-kpi:nth-child(9) { animation-delay: 0.45s; }
    .dash-kpi:nth-child(10) { animation-delay: 0.50s; }
    @keyframes kpiFadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .dash-kpi-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .dash-kpi-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .dash-kpi:hover .dash-kpi-icon { transform: scale(1.1) rotate(3deg); box-shadow: 0 4px 12px var(--color-primary-soft); }
    .dash-kpi-icon.green { background: var(--color-success-soft, rgba(79, 143, 104, 0.14)); color: var(--color-green); }
    .dash-kpi-icon.blue { background: rgba(24, 167, 181, 0.14); color: var(--color-blue); }
    .dash-kpi-icon.yellow { background: var(--color-warning-soft, rgba(214, 168, 79, 0.14)); color: var(--color-yellow); }
    .dash-kpi-icon.red { background: var(--color-danger-soft, rgba(199, 92, 74, 0.14)); color: var(--color-red); }
    .dash-kpi-icon.primary { background: var(--color-primary-soft); color: var(--color-primary); }
    .dash-kpi-trend { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); font-weight: 500; }
    .dash-kpi-trend.up { background: var(--color-success-soft, rgba(79, 143, 104, 0.12)); color: var(--color-green); }
    .dash-kpi-trend.down { background: var(--color-danger-soft, rgba(199, 92, 74, 0.12)); color: var(--color-red); }
    .dash-kpi-trend.neutral { background: rgba(116, 121, 111, 0.12); color: var(--color-muted); }
    .dash-kpi-label { font-size: 12px; color: var(--color-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
    .dash-kpi-value { font-size: 26px; font-weight: 700; color: var(--color-heading); font-family: var(--font-title); letter-spacing: 0.02em; line-height: 1.1; }
    .dash-kpi-sub { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
    .dash-kpi-badge { position: absolute; top: 12px; right: 12px; font-size: 10px; padding: 2px 8px; border-radius: var(--radius-pill); font-weight: 600; }
    .dash-kpi-badge.green { background: var(--color-success-soft, rgba(79, 143, 104, 0.12)); color: var(--color-green); }
    .dash-kpi-badge.yellow { background: var(--color-warning-soft, rgba(214, 168, 79, 0.12)); color: var(--color-yellow); }
    .dash-kpi-badge.red { background: var(--color-danger-soft, rgba(199, 92, 74, 0.12)); color: var(--color-red); }

    .dash-charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    .dash-chart-card { background: var(--color-card); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs); border: 1px solid var(--color-border-soft); transition: box-shadow var(--transition-normal), transform var(--transition-normal); }
    .dash-chart-card:hover { box-shadow: var(--shadow-soft); transform: translateY(-1px); }
    .dash-chart-card.full { grid-column: 1 / -1; }
    .dash-chart-card h3 { font-size: 15px; color: var(--color-heading); margin: 0 0 16px; font-family: var(--font-text); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .dash-chart-card h3 i { color: var(--color-primary); font-size: 18px; }
    .dash-chart-card h3::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--color-border-soft), transparent); margin-left: 4px; }
    .dash-chart-wrapper { position: relative; width: 100%; min-height: 250px; }
    .dash-chart-wrapper canvas { width: 100% !important; }

    .dash-alerts { margin-bottom: 28px; }
    .dash-alerts h2 { font-size: 16px; color: var(--color-heading); margin: 0 0 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .dash-alerts h2 i { color: var(--color-yellow); }
    .dash-alerts-list { display: flex; flex-direction: column; gap: 8px; }
    .dash-alert-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--color-card); border: 1px solid var(--color-border-soft); box-shadow: var(--shadow-xs); transition: var(--transition-fast); }
    .dash-alert-item:hover { box-shadow: var(--shadow-soft); }
    .dash-alert-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .dash-alert-icon.normal { background: var(--color-success-soft, rgba(79, 143, 104, 0.12)); color: var(--color-green); }
    .dash-alert-icon.warning { background: var(--color-warning-soft, rgba(214, 168, 79, 0.12)); color: var(--color-yellow); }
    .dash-alert-icon.critical { background: var(--color-danger-soft, rgba(199, 92, 74, 0.12)); color: var(--color-red); }
    .dash-alert-text { font-size: 13px; color: var(--color-text); flex: 1; }

    .dash-recent { margin-bottom: 24px; }
    .dash-recent h2 { font-size: 16px; color: var(--color-heading); margin: 0 0 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .dash-recent h2 i { color: var(--color-primary); }
    .dash-recent-list { display: flex; flex-direction: column; gap: 6px; }
    .dash-recent-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--color-card); border: 1px solid var(--color-border-soft); font-size: 13px; transition: box-shadow var(--transition-fast), transform var(--transition-fast); }
    .dash-recent-item:hover { box-shadow: var(--shadow-soft); transform: translateX(2px); }
    .dash-recent-item i { font-size: 16px; }
    .dash-recent-item .type-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dash-recent-item .type-icon.consumption { background: var(--color-success-soft, rgba(79,143,104,0.12)); color: var(--color-green); }
    .dash-recent-item .type-icon.restock { background: rgba(24,167,181,0.12); color: var(--color-blue); }
    .dash-recent-item .type-icon.perdida { background: var(--color-danger-soft, rgba(199,92,74,0.12)); color: var(--color-red); }
    .dash-recent-item .type-icon.dano { background: var(--color-warning-soft, rgba(214,168,79,0.12)); color: var(--color-yellow); }
    .dash-recent-item .type-icon.adjustment { background: rgba(116,121,111,0.12); color: var(--color-muted); }
    .dash-recent-info { flex: 1; }
    .dash-recent-info strong { color: var(--color-heading); }
    .dash-recent-time { font-size: 11px; color: var(--color-muted); }

    .dash-empty { text-align: center; padding: 48px 20px; color: var(--color-muted); }
    .dash-empty i { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .dash-empty p { margin: 0; font-size: 14px; }

    .dash-error { text-align: center; padding: 40px 20px; }
    .dash-error i { font-size: 40px; color: var(--color-red); display: block; margin-bottom: 10px; }
    .dash-error p { color: var(--color-muted); font-size: 14px; }
    .dash-error button { margin-top: 12px; }

    .dash-hidden { display: none !important; }

    .skeleton { background: linear-gradient(90deg, var(--color-border-soft) 25%, var(--color-card-soft) 50%, var(--color-border-soft) 75%); background-size: 200% 100%; animation: skeletonShine 1.4s ease infinite; border-radius: var(--radius-xs); }
    @keyframes skeletonShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .dash-chart-wrapper canvas { animation: chartFadeIn 1s ease-out; }
    @keyframes chartFadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    @media (max-width: 960px) {
      .dash-charts-grid { grid-template-columns: 1fr; }
      .dash-kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-header h1 { font-size: 24px; }
    }
    @media (max-width: 600px) {
      .dash-kpi-grid { grid-template-columns: 1fr; }
      .dash-filters { gap: 6px; }
      .dash-filter-btn { padding: 6px 12px; font-size: 12px; }
      .dash-kpi-value { font-size: 22px; }
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2E59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app-loader"><div class="loader-content"><img src="/images/roomtab-logo-white.png" alt="RoomTab" class="loader-logo"><div class="loader-spinner"></div><p class="loader-text">Cargando...</p></div></div>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="sidebar" id="sidebar-container"></div>

    <main class="main-panel">
      <header class="main-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
          <i class="ph-light ph-list"></i>
        </button>
        <div class="main-header-title">
          <div class="breadcrumb">
            <span class="crumb">
              <i class="ph-light ph-house"></i>
              <span class="crumb-current" data-i18n="navDashboard">Panel de Control</span>
            </span>
          </div>
          <div class="dash-header">
            <h1 data-i18n="dashboardTitle">Panel de Control</h1>
            <p data-i18n="dashboardDesc">Resumen operativo de minibares — Sistema de gestión de minibar</p>
          </div>
        </div>
        <div class="header-controls">
          <div class="theme-toggle-group" id="app-theme-switcher">
            <button class="theme-toggle-btn active" data-theme-mode="light" aria-label="Modo claro" title="Modo claro">
              <i class="ph-light ph-sun"></i>
            </button>
            <button class="theme-toggle-btn" data-theme-mode="dark" aria-label="Modo oscuro" title="Modo oscuro">
              <i class="ph-light ph-moon"></i>
            </button>
          </div>
          <div class="header-lang-group" id="app-lang-selector">
            <button class="header-lang-btn active" data-lang="es">ES</button>
            <button class="header-lang-btn" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <div id="dash-content">
        <div class="dash-filters" id="dash-filters">
          <button class="dash-filter-btn" data-filter="today"><i class="ph-light ph-calendar-blank"></i> <span data-i18n="dashboardToday">Hoy</span></button>
          <button class="dash-filter-btn" data-filter="week"><i class="ph-light ph-calendar-week"></i> <span data-i18n="dashboardWeek">Esta semana</span></button>
          <button class="dash-filter-btn active" data-filter="month"><i class="ph-light ph-calendar"></i> <span data-i18n="dashboardThisMonth">Este mes</span></button>
        </div>

        <div id="dash-kpis" class="dash-kpi-grid"></div>

        <div class="dash-alerts" id="dash-alerts-section">
          <h2><i class="ph-light ph-bell"></i> <span data-i18n="dashboardAlerts">Alertas operativas</span></h2>
          <div class="dash-alerts-list" id="dash-alerts-list"></div>
        </div>

        <div class="dash-charts-grid">
          <div class="dash-chart-card">
            <h3><i class="ph-light ph-buildings"></i> <span data-i18n="dashboardConsumptionByFloor">Consumo por piso</span></h3>
            <div class="dash-chart-wrapper"><canvas id="chart-floor"></canvas></div>
          </div>
          <div class="dash-chart-card">
            <h3><i class="ph-light ph-cube"></i> <span data-i18n="dashboardTopProducts">Top productos consumidos</span></h3>
            <div class="dash-chart-wrapper"><canvas id="chart-products"></canvas></div>
          </div>
          <div class="dash-chart-card">
            <h3><i class="ph-light ph-bed"></i> <span data-i18n="dashboardTopRooms">Top habitaciones</span></h3>
            <div class="dash-chart-wrapper"><canvas id="chart-rooms"></canvas></div>
          </div>
        </div>

        <div class="dash-recent" id="dash-recent-section">
          <h2><i class="ph-light ph-clock"></i> <span data-i18n="dashboardRecentMovements">Movimientos recientes</span></h2>
          <div class="dash-recent-list" id="dash-recent-list"></div>
        </div>
      </div>

      <div id="dash-error" class="dash-error dash-hidden">
        <i class="ph-light ph-warning-circle"></i>
        <p id="dash-error-msg">Error al cargar los datos.</p>
        <button class="btn-primary" onclick="location.reload()">Reintentar</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/loader.js"></script>

  <script src="/js/app.js" defer></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/chatbot.js" defer></script>
  <script>
    (function() {
      var theme = localStorage.getItem("roomtab-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("roomtab-lang") || "es";
      document.documentElement.setAttribute("lang", lang);
      Loader.show();
      document.querySelectorAll(".sidebar-nav a.nav-item[href]").forEach(function(link) {
        link.addEventListener("click", function(e) {
          var href = link.getAttribute("href");
          if (!href || href === "#" || href.startsWith("http") || href.startsWith("//") || href.startsWith("/api")) return;
          e.preventDefault();
          Loader.show();
          setTimeout(function() { window.location.href = href; }, 400);
        });
      });
    })();
  </script>
</body>
</html>
