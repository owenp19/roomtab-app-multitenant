<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title data-i18n="profileTitle">Perfil – RoomTab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">

  <script src="/js/theme-loader.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <link rel="icon" type="image/png" href="/images/roomtab-app-icon.png" sizes="any">
  <link rel="apple-touch-icon" href="/images/roomtab-app-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2E59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app-loader"><div class="loader-content"><img src="/images/roomtab-logo-white.png" alt="RoomTab" class="loader-logo"><div class="loader-spinner"></div><p class="loader-text">Cargando...</p></div></div>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="sidebar" id="sidebar-container"></div>

    <main class="main-panel">
      <header class="main-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
          <i class="ph-light ph-list"></i>
        </button>

        <div class="main-header-title">
          <div class="breadcrumb">
            <i class="ph-light ph-house"></i>
            <span data-i18n="breadcrumbHome">Minibar</span>
            <i class="ph-light ph-caret-right"></i>
            <strong data-i18n="profileTitle">Perfil</strong>
          </div>

          <h1 data-i18n="profileTitle">Perfil</h1>
          <p data-i18n="profileDesc">Gestiona tu información personal y foto de perfil.</p>
        </div>

        <div class="header-controls">
          <div class="theme-toggle-group" id="app-theme-switcher">
            <button class="theme-toggle-btn active" data-theme-mode="light" aria-label="Modo claro" title="Modo claro">
              <i class="ph-light ph-sun"></i>
            </button>
            <button class="theme-toggle-btn" data-theme-mode="dark" aria-label="Modo oscuro" title="Modo oscuro">
              <i class="ph-light ph-moon"></i>
            </button>
          </div>
          <div class="header-lang-group" id="app-lang-selector">
            <button class="header-lang-btn active" data-lang="es">ES</button>
            <button class="header-lang-btn" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <div class="profile-grid">
        <!-- Photo Card -->
        <div class="profile-photo-card">
          <div class="profile-avatar-wrap">
            <img loading="lazy" id="profile-avatar-img" class="profile-avatar-img" src="" alt="Foto de perfil" />
            <div class="profile-avatar-placeholder" id="profile-avatar-placeholder">
              <span id="profile-initials">OP</span>
            </div>
            <div class="profile-avatar-overlay" id="profile-avatar-overlay" title="Cambiar foto">
              <i class="ph-light ph-camera"></i>
            </div>
            <input type="file" id="profile-photo-input" accept="image/*" />
          </div>
          <div class="profile-photo-name" id="profile-display-name">Cargando…</div>
          <div class="profile-photo-role" id="profile-display-role">—</div>
        </div>

        <!-- Form Card -->
        <div class="profile-form-card">
          <h2 data-i18n="profileTitle">Perfil</h2>
          <p data-i18n="profileDesc">Gestiona tu información personal y foto de perfil.</p>

          <div class="profile-field">
            <label for="profile-name" data-i18n="profileName">Nombre completo</label>
            <input type="text" id="profile-name" data-i18n-placeholder="profileNamePlaceholder" placeholder="Tu nombre completo" />
          </div>

          <div class="profile-field">
            <label for="profile-email" data-i18n="profileEmail">Correo electrónico</label>
            <input type="email" id="profile-email" data-i18n-placeholder="profileEmailPlaceholder" placeholder="correo@ejemplo.com" />
          </div>

          <div class="profile-field">
            <label for="profile-phone" data-i18n="profilePhone">Teléfono</label>
            <input type="text" id="profile-phone" data-i18n-placeholder="profilePhonePlaceholder" placeholder="+57 300 123 4567" />
          </div>

          <hr class="profile-divider">

          <h3 style="font-size:14px;color:var(--color-heading);margin:16px 0 8px;font-weight:600;">Hotel / Empresa</h3>

          <div class="profile-field">
            <label for="profile-hotel-name">Nombre del hotel</label>
            <input type="text" id="profile-hotel-name" placeholder="Nombre del hotel o empresa" />
          </div>

          <div class="profile-field">
            <label for="profile-minibar-name">Nombre del minibar</label>
            <input type="text" id="profile-minibar-name" placeholder="Ej: Minibar Suite" />
          </div>

          <div class="profile-actions">
            <button class="btn-primary" type="button" id="profile-save-btn">
              <i class="ph-light ph-floppy-disk"></i>
              <span data-i18n="profileSave">Guardar cambios</span>
            </button>
          </div>

          <div id="profile-status" class="profile-status"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/loader.js"></script>

  <script src="/js/app.js" defer></script>
  <script src="/js/chatbot.js" defer></script>
  <script src="/js/perfil.js" defer></script>
  <script>
    (function() {
      var theme = localStorage.getItem("roomtab-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("roomtab-lang") || "es";
      document.documentElement.setAttribute("lang", lang);

      document.querySelectorAll(".sidebar-nav a.nav-item[href]").forEach(function(link) {
        link.addEventListener("click", function(e) {
          var href = link.getAttribute("href");
          if (!href || href === "#" || href.startsWith("http") || href.startsWith("//") || href.startsWith("/api")) return;
          e.preventDefault();
          Loader.show();
          setTimeout(function() {
            window.location.href = href;
          }, 400);
        });
      });
    })();
  </script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
